<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>DISC 人格特質測驗</title>

<!-- 基本資訊 -->
<meta name="version" content="3.0">
<meta name="author" content="莊士勇 Steven">
<meta name="description" content="本測驗依據 DISC 行為模式理論設計，透過生活與職場中的情境題，了解你的行為風格。分為青年版（20 題）與大眾版（40 題）。">

<!-- 社群分享設定 -->
<meta property="og:title" content="DISC 人格特質測驗">
<meta property="og:description" content="你比較像老虎、孔雀、無尾熊還是貓頭鷹？透過情境題了解你的行為風格。">
<meta property="og:type" content="website">

<!-- 網站小圖示 -->
<link rel="icon" href="disc.ico" type="image/x-icon">

<style>
/* ===== 共用色彩與字體（四大測驗統一使用） ===== */
:root {
  --bg: #f6f5f2;          /* 頁面底色：溫和米白 */
  --surface: #ffffff;     /* 卡片、區塊底色 */
  --text: #2b2b2b;        /* 主要文字 */
  --muted: #6b6b6b;       /* 次要文字 */
  --line: #e2e0da;        /* 分隔線、外框 */
  --brand: #35628E;       /* 主色：按鈕 */
  --brand-dark: #284c6e;
  --brand-tint: #EBF1F7;  /* 主色的淡色：選取、強調底色 */
  --radius: 14px;
  --font: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 17px;
  line-height: 1.5;
}
.wrap { max-width: 860px; margin: 0 auto; padding: 0 16px; }

/* ===== 頁首與步驟指示 ===== */
header { padding: 20px 0 8px; text-align: center; }
h1 { font-size: 26px; margin: 0 0 12px; letter-spacing: 1px; }
.steps { display: flex; justify-content: center; gap: 6px; margin: 0; padding: 0; list-style: none; font-size: 15px; color: var(--muted); }
.steps li { padding: 4px 12px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); }
.steps li.on { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 600; }

/* ===== 說明頁 ===== */
.intro { text-align: center; padding: 8px 0 4px; }
.intro .desc { font-size: 18px; margin: 12px 0; }
.intro .flow { font-size: 16px; color: var(--brand); font-weight: 600; margin: 12px 0; }
.intro .note { font-size: 15px; color: var(--muted); margin: 12px 0 22px; }
.intro .start-btn { display: block; width: 100%; margin: 0 0 12px; padding: 14px 16px; font-size: 19px; }
.intro .start-btn small { display: block; font-size: 15px; font-weight: 400; opacity: .9; }

/* ===== 作答 ===== */
.question {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px;
  margin: 14px 0;
}
.question .no { font-size: 14px; color: var(--muted); }
.question .text { font-size: 20px; font-weight: 700; margin: 4px 0 14px; }
.opt {
  display: block; width: 100%;
  font: inherit; font-size: 17px; text-align: left; color: var(--text);
  background: var(--bg); border: 2px solid var(--line); border-radius: 12px;
  padding: 12px 14px; margin-bottom: 10px;
  cursor: pointer; -webkit-tap-highlight-color: transparent;
}
.opt:active, .opt.chosen { border-color: var(--brand); background: var(--brand-tint); }
.progress { display: flex; align-items: center; gap: 10px; font-size: 15px; color: var(--muted); }
.progress .track { flex: 1; height: 10px; border-radius: 5px; background: var(--line); overflow: hidden; }
.progress .fill { height: 100%; background: var(--brand); border-radius: 5px; transition: width .2s; }

/* ===== 結果 ===== */
.result-mode { text-align: center; font-size: 17px; font-weight: 600; margin: 4px 0 0; }
.result-meta { text-align: center; color: var(--muted); font-size: 16px; margin: 4px 0 14px; }
.notice { text-align: center; color: var(--muted); font-size: 15px; margin: 12px 0; }

/* 四種動物：上排老虎、孔雀，下排貓頭鷹、無尾熊 */
.matrix { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.animal {
  background: var(--surface); border: 2px solid var(--line); border-radius: var(--radius);
  padding: 12px 8px; text-align: center;
}
.animal .emoji { font-size: 36px; line-height: 1.2; }
.animal .name { font-size: 18px; font-weight: 700; }
.animal .type { font-size: 13px; color: var(--muted); }
.animal .count { font-size: 30px; font-weight: 700; color: var(--muted); }
.animal.primary { border-color: var(--brand); background: var(--brand-tint); }
.animal.primary .count { color: var(--brand); }
.animal.secondary { border-color: #9db3c9; }

.summary { text-align: center; margin: 18px 0 8px; font-size: 18px; }
.summary p { margin: 4px 0; }
.analysis {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 14px 16px; margin: 12px 0;
}
.analysis h3 { font-size: 16px; color: var(--muted); margin: 0 0 6px; }
.analysis h4 { font-size: 19px; margin: 10px 0 4px; }
.analysis p { margin: 0; line-height: 1.7; }

/* ===== 按鈕 ===== */
.btn {
  border: none; border-radius: 12px;
  padding: 12px 18px;
  font: inherit; font-size: 17px; font-weight: 600;
  cursor: pointer;
  background: var(--brand); color: #fff;
}
.btn.ghost { background: var(--surface); color: var(--text); border: 1px solid var(--line); }
.btn-row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 16px 0; }

/* ===== 結果圖片視窗 ===== */
.overlay {
  position: fixed; inset: 0; z-index: 10;
  background: rgba(0,0,0,.6);
  display: flex; align-items: center; justify-content: center;
  padding: 16px;
}
.overlay .panel {
  background: var(--surface); border-radius: var(--radius);
  max-width: 480px; width: 100%; max-height: 90vh; overflow: auto;
  padding: 16px; text-align: center;
}
.overlay img { width: 100%; border: 1px solid var(--line); border-radius: 8px; }

/* ===== 頁尾 ===== */
footer { text-align: center; color: var(--muted); font-size: 14px; padding: 24px 0 32px; line-height: 1.8; }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>DISC 人格特質測驗</h1>
    <ol class="steps" id="steps">
      <li data-step="quiz">1 作答</li>
      <li data-step="result">2 結果</li>
    </ol>
  </header>

  <main id="app"></main>

  <!-- 版權宣告 -->
  <footer>
    本測驗依據 William Moulton Marston(1928)DISC行為模式理論，<br>
    並由 莊士勇 職涯諮詢師 依現代生活與職場情境重新設計。<br>
    &copy; 2025–2026 GCDF全球職涯發展師 莊士勇 設計
  </footer>
</div>

<!-- 載入題目 -->
<script src="questions-youth.js"></script>
<script src="questions-general.js"></script>

<script>
// ===== 作答進度 =====
// 只暫存在使用者自己的瀏覽器（不會上傳），方便不小心重新整理時接著做；超過 24 小時自動作廢。
const STORAGE_KEY = 'disc-progress';
const EXPIRE_MS = 24 * 60 * 60 * 1000;

// ===== 測驗設定 =====
const VERSIONS = {
  youth:   { name: '青年版', who: '國高中生', questions: youthQuestions },
  general: { name: '大眾版', who: '大專以上、社會人士', questions: generalQuestions }
};
const TYPES = ['D', 'I', 'S', 'C'];
const ANIMALS = {
  D: {
    emoji: '🐯', animal: '老虎', type: '支配/主導型（Dominance）',
    description: '你擁有強烈的目標導向和決策能力，這使你在面對挑戰時，往往能夠迅速做出決定並推動事情向前發展。你不怕冒險，並且對達成結果有很高的期待。你擅長帶領他人，也能夠快速識別問題並提出解決方案。不過，有時你可能會太過專注於結果，而忽視他人的感受或需求。因此，記得在與他人合作時，留意聆聽他們的聲音，並保持開放的心態。'
  },
  I: {
    emoji: '🦚', animal: '孔雀', type: '影響/社交型（Influence）',
    description: '你是一個充滿活力和親和力的人，喜歡與人互動並影響他人的情緒和行為。你具備很強的溝通能力，能夠輕鬆地建立聯繫並激勵他人。你對新鮮事物充滿興奮，並且善於在社交場合中自如地應對。然而，有時你可能會因為太關注他人的反應而忽略自己的需求。試著學會在做決定時更加專注於自己的內心聲音，並平衡好自己與他人的期望。'
  },
  S: {
    emoji: '🐨', animal: '無尾熊', type: '穩健/支持型（Steadiness）',
    description: '你擅長維持穩定和和諧的環境，並且樂於支持他人，尤其是在他們需要幫助的時候。你是團隊中的穩定力量，總是能夠在他人面臨困難時提供支持。你重視關係並且願意為他人付出，但有時可能會過於避免衝突，甚至會犧牲自己的需求來迎合他人。學會適時表達自己的觀點並設定邊界，這樣能幫助你更健康地維持人際關係。'
  },
  C: {
    emoji: '🦉', animal: '貓頭鷹', type: '分析/謹慎型（Conscientiousness）',
    description: '你是一個深思熟慮的人，注重細節和準確性。你喜歡在做任何決策之前進行分析，並且有很強的規劃和組織能力。你對工作有很高的標準，並且總是力求完美。然而，有時你可能會過於專注於細節或規範，這可能會讓你在一些情況下難以快速行動。記得在需要時放鬆自己，接受某些情況的不完美，並且在面對不確定性時能夠更果斷地做出選擇。'
  }
};
// 結果的排列：上排老虎、孔雀，下排貓頭鷹、無尾熊
const MATRIX = ['D', 'I', 'C', 'S'];

let state = loadState() || newState();

function newState() {
  return {
    v: 1,
    step: 'intro',
    version: null,
    qOrder: [],     // 打散後的題目順序
    optOrder: [],   // 每一題打散後的選項順序（類型）
    answers: [],    // 每一題選的類型
    current: 0,
    finishedAt: null,
    savedAt: Date.now()
  };
}

function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (!s || Date.now() - s.savedAt > EXPIRE_MS) return null;
    if (s.v !== 1 || (s.version && s.qOrder.length !== VERSIONS[s.version].questions.length)) return null; // 題目有更新時重來
    return s;
  } catch (e) { return null; }
}

function saveState() {
  state.savedAt = Date.now();
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
}

function clearState() {
  try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// 選好版本後開始：題目順序、每題的選項順序都隨機打散
function start(version) {
  const n = VERSIONS[version].questions.length;
  state = newState();
  state.version = version;
  state.qOrder = shuffle([...Array(n).keys()]);
  state.optOrder = state.qOrder.map(() => shuffle([...TYPES]));
  go('quiz');
}

// ===== 畫面切換 =====
const app = document.getElementById('app');

function go(step) {
  state.step = step;
  saveState();
  render();
  window.scrollTo(0, 0);
}

function render() {
  document.getElementById('steps').hidden = state.step === 'intro';
  document.querySelectorAll('#steps li').forEach(li => {
    li.classList.toggle('on', li.dataset.step === state.step);
  });
  if (state.step === 'intro') renderIntro();
  else if (state.step === 'quiz') renderQuiz();
  else renderResult();
}

// ===== 說明頁：選擇版本 =====
function renderIntro() {
  app.innerHTML = `
    <div class="intro">
      <p class="desc">透過生活與職場中的情境題，<br>了解你的行為風格</p>
      <p class="flow">① 作答 → ② 結果</p>
      <p class="note">依照你平常最自然的反應選擇，沒有對錯<br>不需填寫個人資料，結果只存在你的手機</p>
      ${Object.entries(VERSIONS).map(([key, v]) => `
        <button type="button" class="btn start-btn" data-version="${key}">
          ${v.name}（${v.questions.length} 題）<small>${v.who}</small>
        </button>`).join('')}
    </div>`;
  app.querySelectorAll('.start-btn').forEach(btn => {
    btn.onclick = () => start(btn.dataset.version);
  });
}

// ===== 第 1 步：作答 =====
function renderQuiz() {
  const total = state.qOrder.length;
  const i = state.current;
  const q = VERSIONS[state.version].questions[state.qOrder[i]];

  app.innerHTML = `
    <div class="question">
      <div class="no">第 ${i + 1} 題</div>
      <div class="text">${q.text}</div>
      <div id="opts"></div>
    </div>
    <div class="progress">
      <div class="track"><div class="fill" style="width:${(i + 1) / total * 100}%"></div></div>
      <span>${i + 1} / ${total}</span>
    </div>
    <div class="btn-row">
      ${i > 0 ? '<button type="button" class="btn ghost" id="prev">← 上一題</button>' : ''}
    </div>`;

  const opts = document.getElementById('opts');
  state.optOrder[i].forEach(type => {
    const opt = q.options.find(o => o.type === type);
    const el = document.createElement('button');
    el.type = 'button';
    el.className = 'opt' + (state.answers[i] === type ? ' chosen' : '');
    el.textContent = opt.text;
    el.onclick = () => answer(type);
    opts.appendChild(el);
  });

  if (i > 0) document.getElementById('prev').onclick = () => {
    state.current--;
    saveState();
    renderQuiz();
  };
}

// 選完自動進入下一題，最後一題選完就看結果
function answer(type) {
  state.answers[state.current] = type;
  if (state.current < state.qOrder.length - 1) {
    state.current++;
    saveState();
    renderQuiz();
    window.scrollTo(0, 0);
  } else {
    state.finishedAt = Date.now();
    go('result');
  }
}

// ===== 第 2 步：結果 =====
function formatTime(ts) {
  const d = new Date(ts);
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}/${p(d.getMonth() + 1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

// 主要性格：分數最高的（同分全部列出）；次要性格：其餘中分數最高的（0 分不算）
function analyze() {
  const counts = { D: 0, I: 0, S: 0, C: 0 };
  state.answers.forEach(t => counts[t]++);
  const max = Math.max(...TYPES.map(t => counts[t]));
  const primary = TYPES.filter(t => counts[t] === max);
  const rest = TYPES.filter(t => !primary.includes(t));
  const second = rest.length ? Math.max(...rest.map(t => counts[t])) : 0;
  const secondary = second > 0 ? rest.filter(t => counts[t] === second) : [];
  return { counts, primary, secondary };
}

function animalNames(types) {
  return types.map(t => ANIMALS[t].emoji + ANIMALS[t].animal).join('、');
}

function renderResult() {
  const { counts, primary, secondary } = analyze();
  const v = VERSIONS[state.version];

  const section = (label, types) => !types.length ? '' : `
    <div class="analysis">
      <h3>${label}</h3>
      ${types.map(t => `<h4>${ANIMALS[t].emoji} ${ANIMALS[t].animal} － ${ANIMALS[t].type}</h4><p>${ANIMALS[t].description}</p>`).join('')}
    </div>`;

  app.innerHTML = `
    <div class="result-mode">${v.name}（${v.questions.length} 題）</div>
    <div class="result-meta">完成時間：${formatTime(state.finishedAt)}</div>
    <div class="matrix">
      ${MATRIX.map(t => `
        <div class="animal${primary.includes(t) ? ' primary' : secondary.includes(t) ? ' secondary' : ''}">
          <div class="emoji">${ANIMALS[t].emoji}</div>
          <div class="name">${ANIMALS[t].animal}</div>
          <div class="type">${t} ${ANIMALS[t].type.split('（')[0]}</div>
          <div class="count">${counts[t]}</div>
        </div>`).join('')}
    </div>
    <div class="summary">
      <p>你的主要性格是：<strong>${animalNames(primary)}</strong></p>
      ${secondary.length ? `<p>你的次要性格是：<strong>${animalNames(secondary)}</strong></p>` : ''}
    </div>
    ${section('主要性格分析', primary)}
    ${section('次要性格分析', secondary)}
    <div class="btn-row">
      <button class="btn" id="save">下載結果圖片</button>
    </div>
    <div class="notice"><strong>請下載結果圖片或截圖本頁面，<br>請莊老師為您解讀喔</strong></div>
    <div class="btn-row">
      <button class="btn ghost" id="restart">重新開始</button>
    </div>`;

  document.getElementById('save').onclick = showImage;
  document.getElementById('restart').onclick = () => {
    if (!confirm('確定要重新開始嗎？目前的作答結果會被清除。')) return;
    clearState();
    state = newState();
    go('intro');
  };
}

// ===== 產生結果圖片（在手機上畫，不經過網路） =====
// 中文逐字斷行
function wrapLines(ctx, text, maxWidth) {
  const lines = [];
  let line = '';
  for (const ch of text) {
    if (ctx.measureText(line + ch).width > maxWidth && line) {
      lines.push(line);
      line = ch;
    } else {
      line += ch;
    }
  }
  if (line) lines.push(line);
  return lines;
}

function drawResultImage() {
  const W = 1080, PAD = 60, CELL_H = 250, GAP = 24, LINE = 46;
  const { counts, primary, secondary } = analyze();
  const v = VERSIONS[state.version];
  const fontFamily = getComputedStyle(document.body).fontFamily;
  const font = (size, weight) => `${weight || 400} ${size}px ${fontFamily}`;

  // 先算解說文字的行數，決定圖片高度
  const measure = document.createElement('canvas').getContext('2d');
  measure.font = font(30);
  const blocks = [['主要性格分析', primary], ['次要性格分析', secondary]]
    .filter(([, types]) => types.length)
    .map(([label, types]) => ({
      label,
      items: types.map(t => ({ t, lines: wrapLines(measure, ANIMALS[t].description, W - PAD * 2) }))
    }));
  let H = 290 + CELL_H * 2 + GAP + 150;
  blocks.forEach(b => {
    H += 70;
    b.items.forEach(it => { H += 64 + it.lines.length * LINE + 20; });
  });
  H += 130;

  const canvas = document.createElement('canvas');
  canvas.width = W;
  canvas.height = H;
  const ctx = canvas.getContext('2d');

  ctx.fillStyle = '#f6f5f2';
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center';
  ctx.fillStyle = '#2b2b2b';
  ctx.font = font(56, 700);
  ctx.fillText(document.title, W / 2, 100);
  ctx.font = font(38, 700);
  ctx.fillText(`${v.name}（${v.questions.length} 題）`, W / 2, 170);
  ctx.fillStyle = '#6b6b6b';
  ctx.font = font(30);
  ctx.fillText(`完成時間：${formatTime(state.finishedAt)}`, W / 2, 225);

  // 四種動物
  const cellW = (W - PAD * 2 - GAP) / 2;
  MATRIX.forEach((t, k) => {
    const x = PAD + (k % 2) * (cellW + GAP);
    const y = 270 + Math.floor(k / 2) * (CELL_H + GAP);
    const isP = primary.includes(t), isS = secondary.includes(t);
    ctx.fillStyle = isP ? '#EBF1F7' : '#ffffff';
    roundRect(ctx, x, y, cellW, CELL_H, 24);
    ctx.fill();
    ctx.lineWidth = 4;
    ctx.strokeStyle = isP ? '#35628E' : isS ? '#9db3c9' : '#e2e0da';
    ctx.stroke();
    ctx.textAlign = 'center';
    ctx.fillStyle = '#2b2b2b';
    ctx.font = font(64);
    ctx.fillText(ANIMALS[t].emoji, x + cellW / 2, y + 80);
    ctx.font = font(38, 700);
    ctx.fillText(ANIMALS[t].animal, x + cellW / 2, y + 135);
    ctx.fillStyle = isP ? '#35628E' : '#6b6b6b';
    ctx.font = font(60, 700);
    ctx.fillText(String(counts[t]), x + cellW / 2, y + 210);
  });

  // 主要／次要性格
  let y = 270 + CELL_H * 2 + GAP + 70;
  ctx.textAlign = 'center';
  ctx.fillStyle = '#2b2b2b';
  ctx.font = font(38, 700);
  ctx.fillText(`主要性格：${animalNames(primary)}`, W / 2, y);
  if (secondary.length) {
    ctx.font = font(34);
    ctx.fillText(`次要性格：${animalNames(secondary)}`, W / 2, y + 56);
  }
  y += 80;

  // 解說文字
  ctx.textAlign = 'left';
  blocks.forEach(b => {
    y += 70;
    ctx.fillStyle = '#6b6b6b';
    ctx.font = font(30, 700);
    ctx.fillText(b.label, PAD, y);
    b.items.forEach(it => {
      y += 64;
      ctx.fillStyle = '#2b2b2b';
      ctx.font = font(36, 700);
      ctx.fillText(`${ANIMALS[it.t].emoji} ${ANIMALS[it.t].animal} － ${ANIMALS[it.t].type}`, PAD, y);
      ctx.font = font(30);
      it.lines.forEach(line => { y += LINE; ctx.fillText(line, PAD, y); });
      y += 20;
    });
  });

  ctx.textAlign = 'center';
  ctx.fillStyle = '#6b6b6b';
  ctx.font = font(26);
  ctx.fillText('© 2025–2026 GCDF全球職涯發展師 莊士勇 設計', W / 2, H - 70);
  ctx.fillText('shihyungchuang.github.io/disc', W / 2, H - 30);
  return canvas;
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function showImage() {
  const url = drawResultImage().toDataURL('image/png');
  const d = new Date(state.finishedAt);
  const name = `DISC_${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}.png`;

  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.innerHTML = `
    <div class="panel">
      <img src="${url}" alt="DISC 測驗結果">
      <p class="notice">手機請<strong>長按圖片</strong>儲存到相簿</p>
      <div class="btn-row">
        <a class="btn" href="${url}" download="${name}" style="text-decoration:none">下載圖片</a>
        <button class="btn ghost" id="closeImg">關閉</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('#closeImg').onclick = () => overlay.remove();
  overlay.onclick = e => { if (e.target === overlay) overlay.remove(); };
}

render();
</script>
